name: Refresh GitHub Activity

on:
  schedule:
    # Mondays at 03:17 UTC / 11:17 Asia/Shanghai.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-github-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution data
        env:
          GH_ACTIVITY_TOKEN: ${{ secrets.GH_ACTIVITY_TOKEN }}
          GITHUB_LOGIN: lanhao945
        run: >-
          python scripts/fetch_github_activity.py
          --username "$GITHUB_LOGIN"
          --output src/data/github-activity.json

      - name: Commit changed data to main
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- src/data/github-activity.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-activity.json
          git commit -m "chore(data): refresh GitHub activity"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
